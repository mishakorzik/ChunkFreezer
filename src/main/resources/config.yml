# Broadcast a chat message to everyone when a chunk freezes/unfreezes.
broadcast: true

# OVERLOAD PURGE
# Before freezing a chunk, delete these entity types first - the chunk might
# drop below the threshold and not need freezing at all.
overload-purge:

  # Set to false to disable the pre-freeze purge.
  enabled: true

  # Only these types get removed. Everything else is kept.
  entity-types:
    - ARROW
    - SPECTRAL_ARROW
    - FISHING_BOBBER
    - ENDER_PEARL
    - WIND_CHARGE
    - SNOWBALL

# ENTITIES PROTECTION
# Freezes a chunk when too many entities pile up in it.
entities-protection:

  # Set to false to disable entity-based freezing entirely.
  enabled: true

  # How often (ticks) to check each chunk. 20 = 1 second. Min 20.
  check-period-ticks: 40

  # Freeze when entity count reaches this...
  freeze-threshold: 100

  # ...unfreeze when it drops to this or below. Must be lower than freeze-threshold.
  unfreeze-threshold: 50

  # Seconds after a chunk loads/generates before it's allowed to freeze.
  # New chunks can briefly have a high entity count from world generation -
  # this stops that from causing a false freeze. Unfreezing is unaffected.
  grace-seconds: 3

  # If a chunk loads with more than this many entities, wipe them all
  # immediately. 0 disables this.
  destroy-threshold: 300

  # Allow creeper explosions inside a frozen chunk (drops still get
  # redirected out, like normal mob-death drops).
  allow-creeper-explosions: true

  # These types are never counted, so they never cause a freeze.
  ignore-entity-types:
    - ENDER_DRAGON
    - WITHER
    - WARDEN

# INSTANT DESPAWN
# In a frozen chunk with no player nearby, remove eligible entities right
# away instead of waiting. The ignore-entity-types list below is also used by
# /chunk despawn <world> <x> <z>, which works even with this (or entities-protection) turned off.
instant-despawn:

  # Set to false to disable instant despawning entirely.
  enabled: true

  # Blocks from chunk center - no despawning if a player is within this range.
  radius: 48

  # Despawn named (name-tagged) entities too?
  named-entity: false

  # Never despawned, no matter what.
  ignore-entity-types:
    - ENDER_DRAGON
    - WITHER
    - VILLAGER
    - IRON_GOLEM

# ALREADY FROZEN CHUNK
# Frozen chunks normally block every new entity and all fire. These two
# options poke specific holes in that.
frozen-chunk:

  # Entity types allowed to spawn/be placed here, e.g. "COD" also allows
  # using a COD_BUCKET. This is a list of ENTITY TYPES, not item names or
  # blocks - "FIRE" does NOT belong here (fire isn't an entity; see
  # ignore-blockstate-types below for that). Covers boats/chest boats/rafts,
  # all minecart types, spawn eggs, armor stands, item frames, paintings,
  # end crystals, leads (as LEASH_KNOT), and the fish buckets. Empty by
  # default.
  # Full list: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
  ignore-entity-types: []

  # Block types exempt from the fire protections below (ignite/burn/spread).
  # Add FIRE to let players light fires, let fire spread, and let fire burn
  # blocks down inside a frozen chunk - all three at once, from any cause
  # (player or natural). Leave empty to keep fire fully blocked, the
  # default. Same idea as ignore-entity-types above, but for blocks.
  # Full list: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
  ignore-blockstate-types: []

# REDSTONE PROTECTION
# Freezes and silences a chunk when it detects an infinite redstone loop
# (too many redstone updates, too fast).
redstone-protection:

  # Set to false to disable redstone loop detection entirely.
  enabled: true

  # Length of one measurement window, in ticks (20 = 1 second).
  window-ticks: 20

  # Redstone updates allowed per window before it counts as "overloaded".
  max-events-per-window: 350

  # Consecutive overloaded windows needed before actually freezing.
  # Avoids false positives from short bursts.
  required-windows: 4

  # Minimum distinct redstone blocks that must update in a window to count.
  # Filters out a big-but-finite circuit from a genuine infinite loop.
  min-distinct-blocks: 20

  # Seconds after a chunk loads to ignore redstone activity (avoids false
  # positives from chunk init).
  grace-seconds: 1

  # Seconds the chunk stays frozen before the plugin re-checks if it's safe
  # to unfreeze.
  freeze-seconds: 10

  # Force redstone power to 0 once frozen, silencing the loop.
  mute-after-freeze: true

  # Seconds the mute lasts. 0 = forever, until manually unmuted (see the
  # two options below).
  mute-max-seconds: 0

  # Using a lever/button/pressure plate in a muted chunk unmutes it.
  unmute-on-player-interact: true

  # Power arriving from a neighboring unfrozen chunk unmutes it automatically.
  unmute-on-border-power: true

# REGION BORDER PARTICLES
# Folia/CanvasMC only - ignored on regular Paper/Spigot. Shows a blue
# particle wall where a player is about to cross from the region ticking
# them into a different one. Purely visual, never blocks anything. Regions
# resize live as players move, so this is recalculated on the fly rather
# than precomputed.
region-border-particles:

  # Set to false to disable this entirely.
  enabled: true

  # How close (blocks) before the wall appears. Clamped 2-16.
  distance: 4

# BARRIER
# Controls what's blocked from entering a frozen chunk.
barrier:

  # Master switch for everything below.
  enabled: true

  watch-projectiles:

    # Remove projectiles (arrows, tridents, etc.) that get stuck inside a
    # frozen chunk; ones passing through are untouched. Fireworks are always
    # blocked from spawning in a frozen chunk regardless of this setting -
    # to allow them anyway, add FIREWORK_ROCKET to
    # frozen-chunk.ignore-entity-types.
    enabled: true

  watch-items:

    # Master switch for item-related barrier features.
    enabled: true

    # Cancel item drops by a player standing in a frozen chunk, and move any
    # item that lands in one (mob drops, block drops, rolling/thrown items)
    # out to the nearest unfrozen chunk.
    return-player-dropped-item: true

  watch-liquids:

    # Block water/lava flowing from an unfrozen chunk into a frozen one.
    enabled: true

  watch-players:

    # Block Survival/Adventure players from walking, teleporting, or using
    # ender pearls/chorus fruit/portals into a frozen chunk. Creative and
    # Spectator are always allowed through. Everything below only matters
    # if this is true.
    enabled: false

    # Bounce-back strength. 1.0 = full reverse velocity, 0 = stop dead.
    bounce-multiplier: 0.75

    # Persistent action-bar warning while standing in a frozen chunk.
    notify-when-in-frozen: true

    # Damage per blocked entry attempt. 0-20, 0 disables it, 2 = one heart.
    damage-on-entry: 1

    # Radius (blocks) the red border wall is visible at. 0 disables it, 2-16 otherwise.
    particles-on-entry: 4

  watch-entities:

    # Bounce back mobs/vehicles trying to enter a frozen chunk.
    enabled: true

    # Bounce-back strength. Same scale as watch-players above.
    bounce-multiplier: 0.75

# ADVANCED - only touch this if you know what you're doing.
#
# Both lists ship with sensible defaults covering vanilla Minecraft. Walking
# into a frozen chunk is always blocked regardless of what's here - this
# just adds extra coverage on top. Read exactly as written below, no hidden
# fallback: trim an entry (or empty a list) and that protection is off,
# nothing fills back in silently. A typo is ignored silently too, so a
# mistake here can leave a quiet gap - if unsure, leave this section as is.
advanced:

  # Items that create an entity when used (armor stands, item frames,
  # paintings, leads, mob buckets, etc.) - blocked from being placed in a
  # frozen chunk. Boats, minecarts, spawn eggs, and firework rockets are
  # always covered separately and don't need to be listed.
  extra-entity-placing-items:
    - ARMOR_STAND
    - END_CRYSTAL
    - ITEM_FRAME
    - GLOW_ITEM_FRAME
    - PAINTING
    - LEAD
    - COD_BUCKET
    - SALMON_BUCKET
    - TROPICAL_FISH_BUCKET
    - PUFFERFISH_BUCKET
    - AXOLOTL_BUCKET
    - TADPOLE_BUCKET

  # Teleport causes blocked from landing a player in a frozen chunk (on top
  # of walking/ender-pearl/chorus-fruit, which are always blocked).
  # Full list: https://jd.papermc.io/paper/1.21/org/bukkit/event/player/PlayerTeleportEvent.TeleportCause.html
  blocked-teleport-causes:
    - ENDER_PEARL
    - CHORUS_FRUIT
    - NETHER_PORTAL
    - END_PORTAL
    - END_GATEWAY
    - PLUGIN
    - DISMOUNT
    - COMMAND
    - UNKNOWN
